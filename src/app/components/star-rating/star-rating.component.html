<div
  class="star-rating-container"
  role="radiogroup"
  aria-label="Rating"
  (mouseleave)="onMouseLeave()"
>
  @for (star of stars; track star) {
    <button
      type="button"
      #starButton
      role="radio"
      class="star-button"
      [class.is-filled]="isStarFilled(star)"
      [class.is-hovered]="isStarHovered(star)"
      [class.is-active]="isStarActive(star)"
      [attr.aria-checked]="value() === star"
      [attr.aria-label]="star + (star === 1 ? ' star' : ' stars')"
      [attr.tabindex]="getTabIndex(star)"
      (mouseenter)="onMouseEnter(star)"
      (click)="selectRating(star)"
      (keydown)="onKeyDown($event, star)"
      (focus)="onFocus(star)"
    >
      <svg
        class="star-icon"
        viewBox="0 0 24 24"
        fill="currentColor"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
      </svg>
    </button>
  }
</div>
